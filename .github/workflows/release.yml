name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install test runtime binaries
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Determine version
        id: version
        shell: bash
        run: |
          # Auto-incrementing version: major.minor from package.json + run number.
          # Bump major/minor in package.json to reset the series; the run number
          # is monotonically increasing so versions never collide.
          BASE=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set package.json version
        shell: bash
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POLYCODE_OTLP_ENDPOINT: https://otlp.biap.cc
          POLYCODE_OTLP_HEADERS: ${{ secrets.POLYCODE_OTLP_HEADERS }}

      - name: Verify packaged native module ABI
        working-directory: apps/desktop
        run: pnpm run verify:electron-abi

      - name: Build installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # electron-builder 26 can race its per-artifact GitHub publishers while
      # creating a release. Create one draft ourselves and upload the complete,
      # explicit updater asset set before making it visible to clients.
      - name: Create draft release
        shell: pwsh
        run: gh release create "v$env:VERSION" --draft --title "v$env:VERSION" --target "$env:GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload updater assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release"
          $assets = @(
            (Join-Path $releaseDir "latest.yml"),
            (Join-Path $releaseDir "PolyCode-Setup-$env:VERSION.exe"),
            (Join-Path $releaseDir "PolyCode-Setup-$env:VERSION.exe.blockmap")
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing required updater asset: $asset"
            }
          }
          gh release upload "v$env:VERSION" $assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Verify updater assets
        shell: pwsh
        run: |
          $expected = @(
            "latest.yml",
            "PolyCode-Setup-$env:VERSION.exe",
            "PolyCode-Setup-$env:VERSION.exe.blockmap"
          )
          $actual = @(gh release view "v$env:VERSION" --json assets --jq '.assets[].name')
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($missing.Count -ne 0) {
            throw "Draft release is missing updater assets: $($missing -join ', ')"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish complete release
        shell: pwsh
        run: gh release edit "v$env:VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
