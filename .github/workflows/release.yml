name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install test runtime binaries
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Determine version
        id: version
        shell: bash
        run: |
          # Auto-incrementing version: major.minor from package.json + run number.
          # Bump major/minor in package.json to reset the series; the run number
          # is monotonically increasing so versions never collide.
          BASE=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set package.json version
        shell: bash
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POLYCODE_OTLP_ENDPOINT: https://otlp.biap.cc
          POLYCODE_OTLP_HEADERS: ${{ secrets.POLYCODE_OTLP_HEADERS }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify native crash correlation
        run: pnpm --filter polycode-electron test:crash-smoke

      - name: Upload matching Electron native symbols
        shell: pwsh
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN) { throw "SENTRY_AUTH_TOKEN is required for native symbol uploads" }
          $electronVersion = node -p "require('electron/package.json').version"
          $symbolsDir = Join-Path $env:RUNNER_TEMP "polycode-electron-symbols-$electronVersion"
          $archive = "$symbolsDir.zip"
          Invoke-WebRequest "https://github.com/electron/electron/releases/download/v$electronVersion/electron-v$electronVersion-win32-x64-symbols.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $symbolsDir
          node node_modules/@sentry/cli/bin/sentry-cli debug-files upload --org metroid --project polycode --wait $symbolsDir
          if ($LASTEXITCODE -ne 0) { throw "Electron native symbol upload failed" }
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify packaged native module ABI
        working-directory: apps/desktop
        run: pnpm run verify:electron-abi

      - name: Build installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Release assets are uploaded by the publish job, once every platform has built.
      - name: Upload Windows updater assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            apps/desktop/release/latest.yml
            apps/desktop/release/PolyCode-Setup-*.exe
            apps/desktop/release/PolyCode-Setup-*.exe.blockmap

  build-linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      # Same version scheme as Windows so both platforms publish one release tag.
      - name: Determine version
        id: version
        run: |
          BASE=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set package.json version
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POLYCODE_OTLP_ENDPOINT: https://otlp.biap.cc
          POLYCODE_OTLP_HEADERS: ${{ secrets.POLYCODE_OTLP_HEADERS }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify packaged native module ABI
        working-directory: apps/desktop
        run: pnpm run verify:electron-abi

      - name: Build AppImage
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --publish never

      - name: Upload Linux updater assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            apps/desktop/release/latest-linux.yml
            apps/desktop/release/PolyCode-*-x86_64.AppImage

  publish:
    # Creates the draft only after every platform has built, so a failed build
    # never leaves a half-populated release visible to clients.
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          BASE=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      # electron-builder 26 can race its per-artifact GitHub publishers while
      # creating a release. Create one draft ourselves and upload the complete,
      # explicit updater asset set before making it visible to clients.
      - name: Create draft release
        run: gh release create "v$VERSION" --draft --title "v$VERSION" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload updater assets
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then echo "No release assets downloaded" >&2; exit 1; fi
          gh release upload "v$VERSION" "${assets[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      # Each platform's updater reads its own feed file, so both must be present
      # before the release is visible: latest.yml (Windows) and latest-linux.yml.
      - name: Verify updater assets
        run: |
          expected=(
            "latest.yml"
            "PolyCode-Setup-$VERSION.exe"
            "PolyCode-Setup-$VERSION.exe.blockmap"
            "latest-linux.yml"
            "PolyCode-$VERSION-x86_64.AppImage"
          )
          actual=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          missing=()
          for name in "${expected[@]}"; do
            grep -qxF "$name" <<< "$actual" || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Draft release is missing updater assets: ${missing[*]}" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish complete release
        run: gh release edit "v$VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
