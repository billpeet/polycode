packages:
  - apps/*
  - packages/*

# Electron Builder and React Native tooling both expect a conventional, flat
# node_modules tree. Keep pnpm's deterministic resolver and workspace support
# while using the compatible on-disk layout.
nodeLinker: hoisted

overrides:
  app-builder-lib@<26.15.0: ^26.15.0
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  builder-util-runtime@<9.7.0: ^9.7.0
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  linkify-it@<=5.0.0: ^5.0.1
  linkify-it@<=5.0.1: ^5.0.2
  markdown-it@<12.3.2: ^12.3.2
  markdown-it@<=14.1.1: ^14.2.0
  pnpm@>=11.0.0 <11.7.0: ^11.7.0
  pnpm@>=11.0.0 <11.8.0: ^11.8.0
  tar@<7.5.7: ^7.5.8
  tar@<7.5.8: ^7.5.8
  tar@<=7.5.10: ^7.5.11
  tar@<=7.5.15: ^7.5.16
  tar@<=7.5.16: ^7.5.17
  tar@<=7.5.17: ^7.5.18
  tar@<=7.5.18: ^7.5.19
  tar@<=7.5.2: ^7.5.8
  tar@<=7.5.20: ^7.5.21
  tar@<=7.5.3: ^7.5.8
  tar@<=7.5.9: ^7.5.10
  uuid@<11.1.1: ^11.1.1
  vite: ^8.0.0

# pnpm 11 blocks unreviewed dependency lifecycle scripts. These packages need
# their platform binaries during install; better-sqlite3 is handled by the root
# postinstall so it gets the Electron ABI build rather than the host Node build.
allowBuilds:
  '@sentry/cli': true
  better-sqlite3: false
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true

strictDepBuilds: true

minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.7.0'
  - '@posthog/core@1.49.2'
  - '@posthog/types@1.407.1'
  - posthog-js@1.422.5
